[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-osint"
version = "1.0.0"
description = "SPECTER - a console OSINT toolkit for person investigations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SPECTER contributors" }]
keywords = ["osint", "investigation", "reconnaissance", "cli", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "rich>=13.7",
    "dnspython>=2.4",
    "phonenumbers>=8.13",
    "Pillow>=10.0",
]

[project.scripts]
specter = "specter.cli:main"

[project.gui-scripts]
specter-gui = "specter.gui:main"

[tool.setuptools.packages.find]
include = ["specter*"]

[tool.setuptools.package-data]
specter = ["data/*.json", "data/*.txt"]
